[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-fix"
version = "0.4.0"
description = "Local-first Discord companion with authorized sources and cited summaries"
requires-python = ">=3.11"
dependencies = []

[project.gui-scripts]
discord-fix = "discord_fix.__main__:main"

[tool.setuptools.packages.find]
include = ["discord_fix*"]

[tool.setuptools.package-data]
discord_fix = ["dashboard.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
